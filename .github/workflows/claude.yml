name: Claude

# Claude implements an issue when a maintainer labels it `claude`, and answers `@claude` in the
# comments of issues and pull requests (for example to fix what Claude Review found). It opens a
# pull request with the Claude GitHub App's token, so Test and Lint run on it and Claude Review
# reviews it and merges it when it passes.
#
# No secret is stored: the action exchanges the workflow's OIDC token both for the Claude App's
# installation token and, through workload identity federation, for a short-lived Claude API
# token. The federation identifiers are not credentials and live in repository variables.
# The action itself refuses anyone without write access to the repository. Claude may run only the
# build, check and test commands and plain git and gh commands, not arbitrary pnpm, vp or git
# invocations, since the issue or comment it reads may come from someone else.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  # Without a queue GitHub keeps one pending run per group and drops the rest, so a second
  # `@claude` while the first runs would be lost.
  queue: max

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "22"
          cache: true

      - run: vp install

      # A labelled issue: Claude implements it and opens a pull request.
      - if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          label_trigger: claude
          track_progress: true
          prompt: |
            Implement issue #${{ github.event.issue.number }} of ${{ github.repository }}.

            1. Read the issue and the code it concerns. Follow the conventions of the code around it.
            2. Make the change, with tests for it.
            3. Run `vp run build`, `vp check`, `vp test` and `vp run --filter ./test test`, and fix what fails.
            4. Do not change the version in packages/drizzler/package.json: a version change on main publishes to npm.
            5. Commit, push the branch, and open a pull request against main with `gh pr create`. Its title
               says what changed; its body explains the change and ends with `Closes #${{ github.event.issue.number }}`.
          claude_args: >-
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(vp install),Bash(vp run build),Bash(vp check),Bash(vp check --fix),Bash(vp test),Bash(vp test:*),Bash(vp run --filter ./test test),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      # An `@claude` comment: Claude does what it asks, on the pull request's branch when there is one.
      - if: github.event_name != 'issues'
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: >-
            --append-system-prompt "The dependencies were installed from the default branch: run vp install after switching to a pull request's branch. Do not change the version in packages/drizzler/package.json."
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(vp install),Bash(vp run build),Bash(vp check),Bash(vp check --fix),Bash(vp test),Bash(vp test:*),Bash(vp run --filter ./test test),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr diff:*)"
