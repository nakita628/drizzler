name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - run: vp install

      - run: vp run build

      - run: vp check

      - run: vp test

      # test/ drives the packaged CLI from dist, so it runs after the build.
      - run: vp run --filter ./test test
