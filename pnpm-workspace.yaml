packages:
  - packages/*
  - fixtures/*
  - examples/*
  - test
allowBuilds:
  better-sqlite3: true
  esbuild: true
# typespeclint (the TypeSpec linter of `pnpm lint:typespec`) had its first release a day before it
# was adopted here. The entry names that one version, so a later release waits out the age gate.
minimumReleaseAgeExclude:
  - typespeclint@0.0.1
overrides:
  drizzler: link:packages/drizzler
  # @heroui/react reaches these types packages; their newer releases pull in Adobe's Spectrum
  # design system (thousands of icon files) for declarations erased at build time.
  # hono-takibi pins effect and @effect/platform-node to 4.0.6, whose platform-node-shared floats
  # to a release that imports what effect 4.0.6 lacks; hold it to the one it ships with.
  "@effect/platform-node@4.0.6>@effect/platform-node-shared": 4.0.6
  "@react-types/color": 3.1.4
  "@react-types/slider": 3.8.4
